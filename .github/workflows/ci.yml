name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint & test (pwsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psmodules-${{ runner.os }}-pester5-psscriptanalyzer

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          foreach ($m in @(
              @{ Name = 'Pester'; MinimumVersion = '5.0' },
              @{ Name = 'PSScriptAnalyzer'; MinimumVersion = '1.0' }
          )) {
              $have = Get-Module -ListAvailable -Name $m.Name |
                  Where-Object { $_.Version -ge [version]$m.MinimumVersion }
              if (-not $have) {
                  Install-Module @m -Force -Scope CurrentUser -SkipPublisherCheck
              }
          }

      - name: Syntax check
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path ./awspricer.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "awspricer.ps1 has $($errors.Count) parse error(s)."
          }
          Write-Host 'awspricer.ps1 parsed with no syntax errors.'

      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($findings) {
              $findings | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
              throw "PSScriptAnalyzer reported $($findings.Count) finding(s)."
          }
          Write-Host 'PSScriptAnalyzer: clean.'

      - name: Test (Pester)
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Throw = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = './testresults.xml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-results
          path: testresults.xml
          if-no-files-found: ignore
